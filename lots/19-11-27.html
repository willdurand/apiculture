<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Traçabilité du lot de miel n°19-11-27 récolté par William Durand.">
<title>Miel de printemps 2026 · Lot n°19-11-27 · William Durand</title>
<style>
  :root {
    --bg: #eaf6ee;
    --card: #ffffff;
    --accent: #2f9e6b;
    --accent-soft: #cfeadb;
    --text: #3a2e1f;
    --muted: #8a7a5e;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    border-top: 6px solid var(--accent);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    max-width: 600px;
    padding: 1.75rem 1.25rem;
    width: 100%;
  }
  h1 {
    font-size: 1.35rem;
    letter-spacing: 0.5px;
    margin: 0.5rem 0 0.25rem;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 2rem;
    font-size: 0.95rem;
  }
  dl {
    display: grid;
    gap: 1rem;
    margin: 0;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px dashed #eee;
    padding-bottom: 0.6rem;
    gap: 1rem;
    flex-wrap: wrap;
    flex-direction: column;
  }
  dt {
    color: var(--muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  dd {
    margin: 0;
    font-weight: 600;
    text-align: right;
  }
  .explainer {
    margin-top: 1.5rem;
    padding: 1rem 1.1rem;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    font-size: 0.95rem;
    line-height: 1.5;

    & :first-child {
      margin-top: 0;
    }

    & :last-child {
      margin-bottom: 0;
    }
  }
  footer {
    text-align: center;
    margin-top: 2rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
  @media (min-width: 600px) {
    h1 {
      font-size: 1.6rem;
    }
    .card {
      padding: 2.5rem 2rem;
    }
    .row {
      flex-direction: row;
    }
  }
  @media print {
    body {
      background: #fff;
      padding: 0;
    }
    .card {
      box-shadow: none;
      border-radius: 0;
      border-top-width: 4px;
    }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Miel de printemps 2026</h1>
    <p class="subtitle">Numéro de lot : <strong>19-11-27</strong></p>
    <dl>
      <div class="row"><dt>Date de Durabilité Minimale (DDM)</dt><dd>19/11/2027</dd></div>
      <div class="row"><dt>Conditionné le</dt><dd>19/05/2026</dd></div>
      <div class="row"><dt>Récolté le</dt><dd>09/05/2026</dd></div>
      <div class="row"><dt>Lieu de récolte</dt><dd>Plaine de la Limagne, Auvergne, France</dd></div>
      <div class="row"><dt>Nombre de ruches récoltées</dt><dd>4 ruches</dd></div>
    </dl>
    <footer>William Durand</footer>
  </main>
</body>
</html>
